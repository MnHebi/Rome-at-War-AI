# Project-scoped defaults; merge with existing configuration, not over it.
model = "gpt-6-astra"
model_reasoning_effort = "medium"

# Leave service_tier unset here. In the CLI, use /fast off and /fast status;
# a saved session or other configuration layer may still select Fast mode.

[agents]
# Sequential by default. Two child slots preserve explicitly justified pairs;
# this is a concurrency ceiling, not a target or a per-task delegation budget.
max_concurrent_threads_per_session = 2
